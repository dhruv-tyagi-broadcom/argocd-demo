# Auto-attach: any VKS cluster labelled env=dev or env=prod is registered with
# Argo CD automatically, and tagged with the same env so apps can target it.
apiVersion: argocd-service.vsphere.vmware.com/v1alpha1
kind: EntityManagementPolicy
metadata:
  name: attach-dev
  namespace: dev-r734w
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  enabled: true
  rules:
    - apiGroup: cluster.x-k8s.io
      kind: Cluster
      namespaces:
        nameSelector: ["dev-r734w"]
      labelSelector:
        matchLabels:
          env: dev
  config:
    secretLabels:
      env: dev
    argoCDProject: default
---
apiVersion: argocd-service.vsphere.vmware.com/v1alpha1
kind: EntityManagementPolicy
metadata:
  name: attach-prod
  namespace: dev-r734w
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  enabled: true
  rules:
    - apiGroup: cluster.x-k8s.io
      kind: Cluster
      namespaces:
        nameSelector: ["dev-r734w"]
      labelSelector:
        matchLabels:
          env: prod
  config:
    secretLabels:
      env: prod
    argoCDProject: default
