# One demo-app per attached VKS cluster.
# The cluster's env label (dev/prod) picks the folder: apps/demo-app/<env>
# The app is only created once the cluster is attached, so it never deploys too early.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-app
  namespace: dev-r734w
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: env
              operator: In
              values: [dev, prod]
  template:
    metadata:
      name: 'demo-app-{{index .metadata.labels "env"}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/dhruv-tyagi-broadcom/vks-gitops-demo.git
        targetRevision: main
        path: 'apps/demo-app/{{index .metadata.labels "env"}}'
      destination:
        server: '{{.server}}'
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:                      # covers the gap while worker nodes are still joining
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
